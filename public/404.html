<!doctype html>
<html lang="mr">
  <head>
    <meta charset="utf-8" />
    <title>महाराष्ट्र राज्य केंद्रप्रमुख व अधिकारी महासंघ</title>
    <script type="text/javascript">
      // SPA Deep-Link Fallback Redirect Script
      var l = window.location;
      var path = l.pathname.replace(/^\/+|\/+$/g, '');
      if (path) {
        window.location.replace(l.protocol + '//' + l.host + '/#/' + path + (l.search || ''));
      } else {
        window.location.replace(l.protocol + '//' + l.host + '/');
      }
    </script>
  </head>
  <body>
    <p style="text-align:center; padding-top: 50px; font-family: sans-serif;">पुनर्निर्देशित करत आहे...</p>
  </body>
</html>

<!doctype html>
<html lang="mr">
  <head>
    <meta charset="utf-8" />
    <title>महाराष्ट्र राज्य केंद्रप्रमुख व अधिकारी महासंघ</title>
    <script type="text/javascript">
      // GitHub Pages SPA Redirect Script
      var l = window.location;
      var path = l.pathname.slice(1);
      if (path.toLowerCase().indexOf('admin') !== -1) {
        window.location.replace(l.protocol + '//' + l.host + '/#admin');
      } else {
        window.location.replace(l.protocol + '//' + l.host + '/');
      }
    </script>
  </head>
  <body>
    <p style="text-align:center; padding-top: 50px; font-family: sans-serif;">पुनर्निर्देशित करत आहे...</p>
  </body>
</html>
